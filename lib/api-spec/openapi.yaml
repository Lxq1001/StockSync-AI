openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /email/settings:
    get:
      operationId: getEmailSettings
      responses:
        "200":
          description: Shared mailbox configuration (no credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
  /email/send:
    post:
      operationId: sendOrderEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderEmailInput"
      responses:
        "200":
          description: Provider accepted the message, or an existing receipt was recovered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailReceipt"
        "400":
          description: Invalid email or catalog selection
        "403":
          description: Origin or supplier not permitted
        "409":
          description: An earlier attempt must be checked before resending
        "429":
          description: Sending limit reached
        "502":
          description: Provider rejected the message or the outcome is uncertain
        "503":
          description: Mailbox or outbox not configured
  /stock-dataset:
    get:
      operationId: getStockDataset
      summary: Supplied catalog, supplier contacts, and sales history
      responses:
        "200":
          description: StockSync datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDataset"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    OrderEmailInput:
      type: object
      additionalProperties: false
      required: [sendId, itemId, supplierId, quantity, to, subject, body]
      properties:
        sendId: {type: string, minLength: 16, maxLength: 150}
        itemId: {type: string, minLength: 1, maxLength: 80}
        supplierId: {type: string, minLength: 1, maxLength: 80}
        quantity: {type: integer, minimum: 1, maximum: 1000000}
        to: {type: string, format: email, maxLength: 254}
        subject: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 5000}
    EmailSettings:
      type: object
      required: [ready, sender, transport, reason, approvedSupplierIds]
      properties:
        ready: {type: boolean}
        sender: {type: string}
        transport: {type: string, enum: [gmail, smtp]}
        reason: {type: string}
        approvedSupplierIds:
          type: array
          items: {type: string}
    EmailReceipt:
      type: object
      required: [sendId, messageId, from, acceptedAt, transport]
      properties:
        sendId: {type: string}
        messageId: {type: string}
        from: {type: string}
        acceptedAt: {type: string}
        transport: {type: string, enum: [gmail, smtp]}
    StockDataset:
      type: object
      required: [inventory, suppliers, salesTransactions, importData]
      properties:
        inventory:
          type: array
          items:
            type: object
            required: [id, name, category, stock, item_price, supplier_id]
            properties:
              id: {type: string}
              name: {type: string}
              category: {type: string}
              stock: {type: number, minimum: 0}
              item_price: {type: number, minimum: 0}
              supplier_id: {type: string}
        suppliers:
          type: array
          items:
            type: object
            required: [supplier_id, name, email]
            properties:
              supplier_id: {type: string}
              name: {type: string}
              email: {type: string, format: email}
        salesTransactions:
          type: array
          items: {$ref: "#/components/schemas/StockSale"}
        importData:
          type: array
          items: {$ref: "#/components/schemas/StockSale"}
    StockSale:
      type: object
      required: [sales_id, orderDate, items]
      properties:
        sales_id: {type: string}
        orderDate: {type: string}
        items:
          oneOf:
            - {$ref: "#/components/schemas/StockSaleItem"}
            - type: array
              minItems: 1
              items: {$ref: "#/components/schemas/StockSaleItem"}
    StockSaleItem:
      type: object
      required: [id, quantity]
      properties:
        id: {type: string}
        quantity: {type: number, minimum: 0}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

