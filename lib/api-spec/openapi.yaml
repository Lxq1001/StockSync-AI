openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /stock-dataset:
    get:
      operationId: getStockDataset
      summary: Supplied catalog, supplier contacts, and sales history
      responses:
        "200":
          description: StockSync datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDataset"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StockDataset:
      type: object
      required: [inventory, suppliers, salesTransactions, importData]
      properties:
        inventory:
          type: array
          items:
            type: object
            required: [id, name, category, stock, item_price, supplier_id]
            properties:
              id: {type: string}
              name: {type: string}
              category: {type: string}
              stock: {type: number, minimum: 0}
              item_price: {type: number, minimum: 0}
              supplier_id: {type: string}
        suppliers:
          type: array
          items:
            type: object
            required: [supplier_id, name, email]
            properties:
              supplier_id: {type: string}
              name: {type: string}
              email: {type: string, format: email}
        salesTransactions:
          type: array
          items: {$ref: "#/components/schemas/StockSale"}
        importData:
          type: array
          items: {$ref: "#/components/schemas/StockSale"}
    StockSale:
      type: object
      required: [sales_id, orderDate, items]
      properties:
        sales_id: {type: string}
        orderDate: {type: string}
        items:
          oneOf:
            - {$ref: "#/components/schemas/StockSaleItem"}
            - type: array
              minItems: 1
              items: {$ref: "#/components/schemas/StockSaleItem"}
    StockSaleItem:
      type: object
      required: [id, quantity]
      properties:
        id: {type: string}
        quantity: {type: number, minimum: 0}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

